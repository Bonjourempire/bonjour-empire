<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administration | Bonjour Empire
    </title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family:
                "Inter",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f7f9fc,
                    #ffffff
                );

            color: #172033;

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            min-height: 82px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            background: #ffffff;

            border-bottom:
                1px solid #edf0f5;
        }


        /* LOGO */

        .logo {
            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;
        }


        .logo-icon {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            overflow: hidden;

            background: #f4a900;
        }


        .logo-icon img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;
        }


        .logo-text strong {
            display: block;

            font-size: 18px;

            color: #08264d;
        }


        .logo-text span {
            display: block;

            margin-top: 3px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1px;

            color: #d79500;
        }


        /* =========================
           CONTENU
        ========================= */

        .admin-container {

            width: 100%;

            max-width: 850px;

            margin: auto;

            padding:
                60px 20px;
        }


        .admin-title {

            text-align: center;

            margin-bottom: 40px;
        }


        .admin-title .badge {

            display: inline-block;

            padding:
                8px 15px;

            border-radius: 50px;

            background: #fff8e7;

            color: #b67800;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }


        .admin-title h1 {

            font-size:
                clamp(32px, 6vw, 52px);

            color: #101a2b;

            margin-bottom: 12px;
        }


        .admin-title p {

            color: #6c7788;

            font-size: 14px;

            line-height: 1.7;
        }


        /* =========================
           CARTE
        ========================= */

        .admin-card {

            background: #ffffff;

            border:
                1px solid #e7ebf1;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(20,35,60,0.07);
        }


        .form-group {

            margin-bottom: 22px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #152238;

            font-size: 13px;

            font-weight: 700;
        }


        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 14px 15px;

            border:
                1px solid #dce2ea;

            border-radius: 9px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            color: #172033;

            background: #fbfcfe;

            transition: 0.25s;
        }


        .form-group textarea {

            min-height: 180px;

            resize: vertical;
        }


        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #d79500;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(215,149,0,0.10);
        }


        /* =========================
           BOUTON
        ========================= */

        .publish-button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 9px;

            background: #082d59;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;
        }


        .publish-button:hover {

            background: #0d407b;

            transform:
                translateY(-2px);
        }


        /* =========================
           RETOUR
        ========================= */

        .back-link {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: #6c7788;

            text-decoration: none;

            font-size: 13px;
        }


        .back-link:hover {

            color: #b67800;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {

                padding: 12px 5%;
            }


            .logo-icon {

                width: 42px;
                height: 42px;
            }


            .logo-text strong {

                font-size: 15px;
            }


            .logo-text span {

                font-size: 8px;
            }


            .admin-container {

                padding:
                    45px 15px;
            }


            .admin-card {

                padding: 22px 17px;

                border-radius: 14px;
            }


            .admin-title h1 {

                font-size: 34px;
            }


            .admin-title p {

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<header>

    <a
        href="index.html"
        class="logo"
    >

        <div class="logo-icon">

            <img
                src="logo.png"
                alt="Logo Bonjour Empire"
            >

        </div>


        <div class="logo-text">

            <strong>
                BONJOUR EMPIRE
            </strong>

            <span>
                ADMINISTRATION
            </span>

        </div>

    </a>

</header>


<main class="admin-container">


    <div class="admin-title">

        <div class="badge">

            ESPACE ADMINISTRATEUR

        </div>


        <h1>

            Publier

        </h1>


        <p>

            Créez et partagez les actualités,
            activités et informations de
            Bonjour Empire.

        </p>

    </div>


    <div class="admin-card">


        <div class="form-group">

            <label for="titre">

                Titre de la publication

            </label>


            <input
                type="text"
                id="titre"
                placeholder="Ex. Grande activité de Bonjour Empire"
            >

        </div>


        <div class="form-group">

            <label for="contenu">

                Contenu

            </label>


            <textarea
                id="contenu"
                placeholder="Écrivez votre publication ici..."
            ></textarea>

        </div>


        <div class="form-group">

            <label for="image_url">

                Lien de l'image (facultatif)

            </label>


            <input
                type="url"
                id="image_url"
                placeholder="https://..."
            >

        </div>


        <button
            class="publish-button"
            type="button"
        >

            <i class="fa-solid fa-paper-plane"></i>

            Publier

        </button>


    </div>


    <a
        href="publications.html"
        class="back-link"
    >

        ← Voir les publications

    </a>


</main>
<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ropbkswmihagfvhcfonb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gSMzK8B2ALsrkpNkAzWAaA_emr3j0GN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const bouton =
    document.querySelector(
        ".publish-button"
    );


bouton.addEventListener(
    "click",
    async function () {

        const titre =
            document.getElementById(
                "titre"
            ).value.trim();


        const contenu =
            document.getElementById(
                "contenu"
            ).value.trim();


        const image_url =
            document.getElementById(
                "image_url"
            ).value.trim();


        /* Vérification */

        if (!titre || !contenu) {

            alert(
                "⚠️ Veuillez remplir le titre et le contenu."
            );

            return;

        }


        /* Désactiver le bouton */

        bouton.disabled = true;

        bouton.innerHTML =
            "⏳ Publication en cours...";


        /* Envoi vers Supabase */

        const { data, error } =
            await supabaseClient
                .from("publications")
                .insert([
                    {
                        titre: titre,
                        contenu: contenu,
                        image_url:
                            image_url || null
                    }
                ])
                .select();


        /* Gestion de l'erreur */

        if (error) {

            console.error(error);

            alert(
                "❌ Erreur : " +
                error.message
            );

            bouton.disabled = false;

            bouton.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> Publier';

            return;

        }


        /* Succès */

        alert(
            "🎉 Publication publiée avec succès !"
        );


        document.getElementById(
            "titre"
        ).value = "";


        document.getElementById(
            "contenu"
        ).value = "";


        document.getElementById(
            "image_url"
        ).value = "";


        bouton.disabled = false;

        bouton.innerHTML =
            '<i class="fa-solid fa-paper-plane"></i> Publier';

    }

);

</script>

</body>

</html>
