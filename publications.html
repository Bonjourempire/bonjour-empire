<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Découvrez les actualités et publications de Bonjour Empire."
    >

    <title>
        Bonjour Empire — Publications
    </title>


    <!-- POLICE -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ICÔNES -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            background: #f7f9fc;

            color: #172033;

            min-height: 100vh;

        }


        /* ==============================
           HEADER
        ============================== */

        header {

            height: 82px;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            background: #ffffff;

            border-bottom:
                1px solid #edf0f5;

        }


        .logo {

            text-decoration: none;

            color: #08264d;

            font-size: 18px;

            font-weight: 800;

        }


        nav {

            display: flex;

            gap: 25px;

        }


        nav a {

            text-decoration: none;

            color: #4e596b;

            font-size: 13px;

            font-weight: 600;

        }


        nav a:hover {

            color: #d79500;

        }


        /* ==============================
           PAGE
        ============================== */

        .page {

            max-width: 1100px;

            margin: auto;

            padding:
                70px 20px;

        }


        .intro {

            text-align: center;

            margin-bottom: 45px;

        }


        .intro span {

            display: inline-block;

            padding:
                7px 13px;

            border-radius: 30px;

            background: #fff8e7;

            color: #b67800;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 15px;

        }


        .intro h1 {

            font-size:
                clamp(32px, 5vw, 52px);

            color: #101a2b;

            margin-bottom: 15px;

        }


        .intro p {

            max-width: 650px;

            margin: auto;

            color: #6c7788;

            font-size: 14px;

            line-height: 1.7;

        }


        /* ==============================
           PUBLICATIONS
        ============================== */

        #publications-container {

            display: grid;

            gap: 25px;

            max-width: 760px;

            margin: auto;

        }


        .chargement {

            text-align: center;

            color: #7a8596;

            padding: 40px;

        }


        /* ==============================
           FOOTER
        ============================== */

        footer {

            margin-top: 70px;

            padding:
                30px 7%;

            text-align: center;

            background: #061d3b;

            color: #ffffff;

            font-size: 11px;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            header {

                padding: 0 5%;

            }


            nav {

                gap: 12px;

            }


            nav a {

                font-size: 10px;

            }

        }

    </style>

</head>


<body>


    <header>

        <a
            href="index.html"
            class="logo"
        >

            BONJOUR EMPIRE

        </a>


        <nav>

            <a href="index.html">
                Accueil
            </a>

            <a href="apropos.html">
                À propos
            </a>

            <a href="talents.html">
                Talents
            </a>

            <a href="opportunites.html">
                Opportunités
            </a>

            <a href="evenements.html">
                Événements
            </a>

        </nav>

    </header>


    <main class="page">


        <section class="intro">

            <span>
                ACTUALITÉS
            </span>

            <h1>
                Publications
            </h1>

            <p>
                Découvrez les actualités,
                activités et informations
                de Bonjour Empire.
            </p>

        </section>


        <section
            id="publications-container"
        >

            <div class="chargement">

                Chargement des publications...

            </div>

        </section>


    </main>


    <footer>

        © 2026 Bonjour Empire —
        Promouvoir les talents,
        créer des opportunités
        et construire l'avenir.

    </footer>
<!-- ==========================================
     CONNEXION À SUPABASE
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://ropbkswmihagfvhcfonb.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_gSMzK8B2ALsrkpNkAzWAaA_emr3j0GN";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function chargerPublications() {

        const container =
            document.getElementById(
                "publications-container"
            );


        const { data, error } =
            await supabaseClient
                .from("publications")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "Erreur Supabase :",
                error
            );

            container.innerHTML = `

                <div class="chargement">

                    ❌ Impossible de charger
                    les publications.

                    <br><br>

                    Vérifiez la connexion
                    à Supabase.

                </div>

            `;

            return;

        }


        if (!data || data.length === 0) {

            container.innerHTML = `

                <div class="chargement">

                    Aucune publication
                    pour le moment.

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        data.forEach(function (publication) {

            const article =
                document.createElement("article");


            article.innerHTML = `

                <div
                    style="
                        background:#ffffff;
                        border:1px solid #e7ebf1;
                        border-radius:16px;
                        padding:25px;
                        box-shadow:0 8px 25px rgba(20,35,60,0.05);
                    "
                >

                    <small
                        style="
                            color:#b67800;
                            font-weight:700;
                        "
                    >

                        ${new Date(
                            publication.created_at
                        ).toLocaleDateString(
                            "fr-FR"
                        )}

                    </small>


                    <h2
                        style="
                            margin:10px 0;
                            color:#152238;
                            font-size:20px;
                        "
                    >

                        ${publication.titre}

                    </h2>


                    <p
                        style="
                            color:#657083;
                            line-height:1.8;
                            font-size:14px;
                        "
                    >

                        ${publication.contenu}

                    </p>


                    ${
                        publication.image_url
                        ?
                        `
                        <img
                            src="${publication.image_url}"
                            alt="${publication.titre}"
                            style="
                                width:100%;
                                margin-top:18px;
                                border-radius:12px;
                                display:block;
                            "
                        >
                        `
                        :
                        ""
                    }


                    <div
                        style="
                            margin-top:20px;
                            padding-top:15px;
                            border-top:1px solid #edf0f4;
                            color:#7a8596;
                            font-size:12px;
                        "
                    >

                        ❤️ 0
                        &nbsp;&nbsp;&nbsp;

                        💬 0
                        &nbsp;&nbsp;&nbsp;

                        ↗ Partager

                    </div>

                </div>

            `;


            container.appendChild(article);

        });

    }


    chargerPublications();

</script>

</body>

</html>
