<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Découvrez les actualités et publications de Bonjour Empire."
    >

    <title>
        Bonjour Empire — Publications
    </title>


    <!-- POLICE -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ICÔNES -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            background: #f7f9fc;

            color: #172033;

            min-height: 100vh;

        }


        /* ==============================
           HEADER
        ============================== */

        header {

            height: 82px;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            background: #ffffff;

            border-bottom:
                1px solid #edf0f5;

        }


        .logo {

            text-decoration: none;

            color: #08264d;

            font-size: 18px;

            font-weight: 800;

        }


        nav {

            display: flex;

            gap: 25px;

        }


        nav a {

            text-decoration: none;

            color: #4e596b;

            font-size: 13px;

            font-weight: 600;

        }


        nav a:hover {

            color: #d79500;

        }


        /* ==============================
           PAGE
        ============================== */

        .page {

            max-width: 1100px;

            margin: auto;

            padding:
                70px 20px;

        }


        .intro {

            text-align: center;

            margin-bottom: 45px;

        }


        .intro span {

            display: inline-block;

            padding:
                7px 13px;

            border-radius: 30px;

            background: #fff8e7;

            color: #b67800;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 15px;

        }


        .intro h1 {

            font-size:
                clamp(32px, 5vw, 52px);

            color: #101a2b;

            margin-bottom: 15px;

        }


        .intro p {

            max-width: 650px;

            margin: auto;

            color: #6c7788;

            font-size: 14px;

            line-height: 1.7;

        }


        /* ==============================
           PUBLICATIONS
        ============================== */

        #publications-container {

            display: grid;

            gap: 25px;

            max-width: 760px;

            margin: auto;

        }


        .chargement {

            text-align: center;

            color: #7a8596;

            padding: 40px;

        }


        /* ==============================
           FOOTER
        ============================== */

        footer {

            margin-top: 70px;

            padding:
                30px 7%;

            text-align: center;

            background: #061d3b;

            color: #ffffff;

            font-size: 11px;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            header {

                padding: 0 5%;

            }


            nav {

                gap: 12px;

            }


            nav a {

                font-size: 10px;

            }

        }

    </style>

</head>


<body>


    <header>

        <a
            href="index.html"
            class="logo"
        >

            BONJOUR EMPIRE

        </a>


        <nav>

            <a href="index.html">
                Accueil
            </a>

            <a href="apropos.html">
                À propos
            </a>

            <a href="talents.html">
                Talents
            </a>

            <a href="opportunites.html">
                Opportunités
            </a>

            <a href="evenements.html">
                Événements
            </a>

        </nav>

    </header>


    <main class="page">


        <section class="intro">

            <span>
                ACTUALITÉS
            </span>

            <h1>
                Publications
            </h1>

            <p>
                Découvrez les actualités,
                activités et informations
                de Bonjour Empire.
            </p>

        </section>


        <section
            id="publications-container"
        >

            <div class="chargement">

                Chargement des publications...

            </div>

        </section>


    </main>


    <footer>

        © 2026 Bonjour Empire —
        Promouvoir les talents,
        créer des opportunités
        et construire l'avenir.

    </footer>


</body>

</html>
